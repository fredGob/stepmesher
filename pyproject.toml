[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stepmesher"
version = "0.1.0"
description = "Mailleur local STEP -> Abaqus : SC8R pour les pièces minces, repli C3D10/C3D4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gmsh>=4.11",
    "numpy>=1.24",
    "scipy>=1.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
stepmesher = "stepmesher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stepmesher = ["default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: tests sur les pièces réelles de stps_test/ (lents)",
]
